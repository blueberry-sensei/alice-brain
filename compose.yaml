name: sag

# Aimed at personal local use by default: SQLite + LanceDB, with no extra database service.
# Everything is written into the sagdata volume, so rebuilding the containers loses nothing.
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        SAG_API_EXTRAS: ""
    environment:
      SAG_ENVIRONMENT: ${SAG_ENVIRONMENT:-dev}
      SAG_DEBUG: "false"
      # For a quick local start only; in prod the app refuses this known weak secret.
      SAG_SECRET_KEY: ${SAG_SECRET_KEY:-dev-insecure-secret-change-me-in-production-0123456789}
      SAG_CORS_ORIGINS: ${SAG_CORS_ORIGINS:-http://localhost:3000}
      SAG_ALLOW_REGISTRATION: ${SAG_ALLOW_REGISTRATION:-false}
      # Four slashes mean the absolute in-container path /data/sag.db.
      SAG_DATABASE_URL: sqlite+aiosqlite:////data/sag.db
      SAG_DATA_DIR: /data/engine
      SAG_UPLOAD_DIR: /data/uploads
      SAG_SAG_VECTOR_PROVIDER: lancedb
      SAG_SAG_LANGUAGE: ${SAG_SAG_LANGUAGE:-en}
      # LLM / Embedding: de trong van khoi dong duoc, cau hinh sau trong Settings.
      SAG_LLM_PROVIDER: ${SAG_LLM_PROVIDER:-openai}
      # Khong co default cua ben thu ba: de trong thi dung endpoint chinh chu cua provider.
      SAG_LLM_BASE_URL: ${SAG_LLM_BASE_URL:-}
      SAG_LLM_API_KEY: ${SAG_LLM_API_KEY:-}
      SAG_LLM_MODEL: ${SAG_LLM_MODEL:-}
      SAG_LLM_MAX_TOKENS: ${SAG_LLM_MAX_TOKENS:-20000}
      SAG_LLM_TIMEOUT_MS: ${SAG_LLM_TIMEOUT_MS:-60000}
      SAG_LLM_MAX_RETRIES: ${SAG_LLM_MAX_RETRIES:-2}
      SAG_EMBEDDING_MODEL: ${SAG_EMBEDDING_MODEL:-bge-m3}
      SAG_EMBEDDING_BASE_URL: ${SAG_EMBEDDING_BASE_URL:-}
      SAG_EMBEDDING_API_KEY: ${SAG_EMBEDDING_API_KEY:-}
      SAG_DOCUMENT_PARSER: ${SAG_DOCUMENT_PARSER:-markitdown}
      SAG_DOCUMENT_EXTRACT_CONCURRENCY: ${SAG_DOCUMENT_EXTRACT_CONCURRENCY:-5}
      SAG_DOCUMENT_CHUNK_MAX_TOKENS: ${SAG_DOCUMENT_CHUNK_MAX_TOKENS:-1000}
      SAG_DOCUMENT_CHUNK_MODE: ${SAG_DOCUMENT_CHUNK_MODE:-standard}
      SAG_JOB_MAX_ATTEMPTS: ${SAG_JOB_MAX_ATTEMPTS:-3}
      SAG_ENGINE_CACHE_SIZE: ${SAG_ENGINE_CACHE_SIZE:-16}
      SAG_ENGINE_WARMUP_COUNT: ${SAG_ENGINE_WARMUP_COUNT:-4}
    volumes:
      - sagdata:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/system/ready').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # The API address the browser talks to (inlined at build time); rebuild web after changing it.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
        # A desktop client build may set this to false; the web build keeps in-page window zoom by default.
        NEXT_PUBLIC_ENABLE_WINDOW_SCALING: ${NEXT_PUBLIC_ENABLE_WINDOW_SCALING:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  sagdata:

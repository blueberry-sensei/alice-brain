# Publish image ALICE lên GitHub Container Registry.
#
# Mục tiêu: người dùng chỉ `docker pull`, không phải clone repo nào. Nhờ đó `alice-brain` và
# `alice-core` giữ được PRIVATE mà image vẫn công khai — trên ghcr.io, visibility của package
# tách rời visibility của repo, và package công khai cho phép pull ẩn danh.
#
# KHÔNG dùng PAT. Engine ALICE CORE vào image api qua image `ghcr.io/<owner>/alice-core` do
# repo alice-core tự publish, nên ở đây `GITHUB_TOKEN` mặc định là đủ.
#
# CÀI ĐẶT MỘT LẦN:
#   1. Repo `alice-core` chạy workflow `publish-image` ít nhất một lần.
#   2. Packages → alice-core → Package settings → Manage Actions access
#      → Add repository → `alice-brain` → role **Read**. (Thiếu bước này thì bước build dưới
#      đây sẽ 403 lúc kéo image engine.)
#   3. Sau lần chạy đầu: Packages → alice-brain-api / alice-brain-web → Package settings
#      → visibility **Public**. Bỏ bước này thì người dùng phải `docker login` mới pull được.

name: publish-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Kiến trúc cần build (thêm linux/arm64 cho máy Apple Silicon; chậm hơn nhiều)"
        default: linux/amd64
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `write` bao hàm cả `read`: vừa push image của repo này, vừa kéo image engine của alice-core.
      packages: write
    strategy:
      # Không fail-fast: web hỏng thì vẫn muốn biết api có build được không.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tính tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/alice-brain-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build và push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Chỉ image api cần engine; với web thì build-arg này thừa và bị bỏ qua.
          build-args: |
            ALICECORE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/alice-core:latest
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

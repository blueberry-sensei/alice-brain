# Publish image ALICE lên GitHub Container Registry.
#
# Mục tiêu: người dùng chỉ `docker pull`, không phải clone repo nào. Nhờ đó `alice-brain` và
# `alice-core` giữ được PRIVATE mà image vẫn công khai — trên ghcr.io, visibility của package
# tách rời visibility của repo, và package công khai cho phép pull ẩn danh.
#
# CÀI ĐẶT MỘT LẦN (xem README mục "Publish image"):
#   1. Secret `ALICE_CORE_TOKEN` — PAT có quyền đọc repo `alice-core` (workflow này nằm ở
#      repo khác nên `GITHUB_TOKEN` mặc định không với tới được).
#   2. Sau lần chạy đầu, vào Packages → alice-brain-api / alice-brain-web → Package settings
#      → đổi visibility sang **Public**. Không làm bước này thì người dùng phải đăng nhập mới pull được.

name: publish-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Kiến trúc cần build (thêm linux/arm64 cho máy Apple Silicon; chậm hơn nhiều)"
        default: linux/amd64
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Không fail-fast: web hỏng thì vẫn muốn biết api có build được không.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web
    steps:
      - name: Lấy alice-brain
        uses: actions/checkout@v4
        with:
          path: alice-brain

      # Engine nằm ở repo riêng và được nạp vào image api qua build context tên `alicecore`
      # (xem apps/api/Dockerfile). Bước này chỉ cần cho image api.
      - name: Lấy alice-core
        if: matrix.name == 'api'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/alice-core
          token: ${{ secrets.ALICE_CORE_TOKEN }}
          path: alice-core

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tính tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/alice-brain-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build và push
        uses: docker/build-push-action@v6
        with:
          context: alice-brain/${{ matrix.context }}
          # Chỉ image api cần engine; với web thì dòng này rỗng và bị bỏ qua.
          build-contexts: ${{ matrix.name == 'api' && 'alicecore=alice-core' || '' }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
